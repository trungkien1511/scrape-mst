name: Scrape MST

on:
  schedule:
    # Chạy 2 tiếng 1 lần, từ 8h sáng đến 6h tối (Giờ VN) - Tương đương 1h-11h UTC
    - cron: "0 1-11/2 * * *"
  workflow_dispatch: # Cho phép bấm chạy bằng tay khi cần

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml gspread google-auth google-auth-oauthlib

      - name: Run scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scrape_mst.py

      - name: Keep repository active
        run: |
          echo "Last run: $(date)" > .last_run
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_run
          git commit -m "Auto-update: $(date)" || echo "No changes"
          git push || echo "Push failed"
